name: OCTO live integration regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-godot:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure and build native C++ solver
        shell: pwsh
        run: |
          . ./tools/dev-shell.ps1
          # Earlier commits accidentally include machine-specific CMake build caches.
          # A GitHub-hosted runner must never reuse those absolute Windows paths.
          if (Test-Path 'build/release') { Remove-Item -LiteralPath 'build/release' -Recurse -Force }
          cmake --preset release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build --preset release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          # Exercise the exact incremental build helper used by run_live_demo.cmd.
          ./tools/build-live-demo.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Live demo build helper failed' }
      - name: Native unit and RPC regressions
        shell: pwsh
        run: |
          python -m pip install 'jsonschema==4.25.0'
          if ($LASTEXITCODE -ne 0) { throw 'Schema dependency installation failed' }
          ctest --test-dir build/release -LE long --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native short regression failed' }
          ctest --test-dir build/release -R '^live\.protocol$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native interactive protocol regression failed' }
          ctest --test-dir build/release -R '^live\.torso_protocol$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native coupled FEM torso protocol regression failed' }
      - name: Install official Godot 4.6.2 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip' -OutFile $archive
          $destination = Join-Path $env:RUNNER_TEMP 'godot-4.6.2'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = (Get-ChildItem -Path $destination -Filter '*.exe' | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot executable missing' }
          "OCTO_GODOT=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Godot headless import, live contact and recovery tests
        shell: pwsh
        run: |
          & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game --editor --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          python tests/integration/godot_live_smoke.py $env:OCTO_GODOT
          if ($LASTEXITCODE -ne 0) { throw 'Godot live integration regression failed' }
      - name: Default Godot Play refuses missing GameReady GLB
        shell: pwsh
        run: |
          if (Test-Path game/assets/Octopus_GameReady_v5.glb) { throw 'Unexpected model already installed before test' }
          $project = Get-Content game/project.godot -Raw
          if (-not $project.Contains('run/main_scene="res://scenes/live_demo.tscn"')) { throw 'Play scene still points at the obsolete bootstrap' }
          $warningLog = & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game --quit-after 6 2>&1 | Out-String
          Write-Host $warningLog
          if (-not $warningLog.Contains('GAME_READY_MODEL_REQUIRED')) { throw 'Default Play silently fell back to the old model' }
          if ($warningLog.Contains('LIVE_GODOT_READY')) { throw 'Default Play unexpectedly launched native physics without the required model' }
      - name: Synthetic GLB skeleton import and Godot skinning exercise
        shell: pwsh
        run: |
          # A synthetic 193-bone triangle rig validates the runtime code path.
          # It does not validate the appearance of the user-supplied GLB.
          python tests/integration/make_synthetic_octopus.py game/assets/Octopus_GameReady_v5.glb
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic GLB creation failed' }
          python tools/check_octopus_model.py game/assets/Octopus_GameReady_v5.glb
          if ($LASTEXITCODE -ne 0) { throw 'GLB structural validation failed' }
          & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game --editor --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot GLB import failed' }
          $modelLog = & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game res://scenes/live_demo.tscn -- --live-model-test 2>&1 | Out-String
          Write-Host $modelLog
          if ($LASTEXITCODE -ne 0) { throw 'Godot skinned model smoke failed' }
          foreach ($marker in @('LIVE_MODEL_LOADED', 'LIVE_FEM_SKIN_BIND_OK', 'LIVE_FEM_SURFACE_READY', 'LIVE_MODEL_SKIN_OK', 'LIVE_GODOT_CONTACT_OK')) {
            if (-not $modelLog.Contains($marker)) { throw "Godot synthetic rig missing $marker" }
          }
