name: OCTO live integration regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-godot:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Configure and build native C++ solver
        shell: pwsh
        run: |
          . ./tools/dev-shell.ps1
          # Earlier commits accidentally include machine-specific CMake build caches.
          # A GitHub-hosted runner must never reuse those absolute Windows paths.
          if (Test-Path 'build/release') { Remove-Item -LiteralPath 'build/release' -Recurse -Force }
          cmake --preset release
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build --preset release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
      - name: Native unit and RPC regressions
        shell: pwsh
        run: |
          ctest --test-dir build/release -LE long --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native short regression failed' }
          ctest --test-dir build/release -R '^live\.protocol$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native interactive protocol regression failed' }
      - name: Install official Godot 4.6.2 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_win64.exe.zip' -OutFile $archive
          $destination = Join-Path $env:RUNNER_TEMP 'godot-4.6.2'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = (Get-ChildItem -Path $destination -Filter '*.exe' | Select-Object -First 1).FullName
          if (-not $binary) { throw 'Godot executable missing' }
          "OCTO_GODOT=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Godot headless import, child-death and timed-out reset tests
        shell: pwsh
        run: |
          & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game --editor --quit
          if ($LASTEXITCODE -ne 0) { throw 'Godot import failed' }
          & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game res://scenes/live_demo.tscn -- --live-restart-test
          if ($LASTEXITCODE -ne 0) { throw 'Godot child-death recovery failed' }
          & $env:OCTO_GODOT --headless --single-threaded-scene --render-thread safe --path game res://scenes/live_demo.tscn -- --live-stall-reset-test
          if ($LASTEXITCODE -ne 0) { throw 'Godot stalled-request reset failed' }
